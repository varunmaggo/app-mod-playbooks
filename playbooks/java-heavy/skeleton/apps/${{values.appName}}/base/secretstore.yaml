apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: ${{ values.appName }}-secretstore
  namespace: ${{ values.namespace }}
spec:
  provider:
    aws:
      service: SecretsManager
      region: ${{ values.awsRegion }}
      auth:
        # Uses the same IRSA role bound to the app's ServiceAccount, so ESO's
        # pod can assume it only for reading this app's secrets.
        jwt:
          serviceAccountRef:
            name: ${{ values.appName }}
            namespace: ${{ values.namespace }}
