apiVersion: v1
kind: ServiceAccount
metadata:
  name: ${{ values.appName }}
  namespace: ${{ values.namespace }}
  annotations:
    # IRSA role provisioned in /infra; grants access to the DB-creds secret in
    # AWS Secrets Manager (via SecretStore) and any other AWS APIs this app needs.
    eks.amazonaws.com/role-arn: arn:aws:iam::${{ values.awsAccountId }}:role/${{ values.appName }}-irsa-role
