apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: ${{ values.appName }}-db-creds
  namespace: ${{ values.namespace }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: ${{ values.appName }}-secretstore
    kind: SecretStore
  target:
    name: ${{ values.appName }}-db-creds
    creationPolicy: Owner
  dataFrom:
    # ACK's RDS controller writes master-user credentials to this Secrets
    # Manager secret when it provisions the DBInstance (see rds-instance.yaml).
    - extract:
        key: ${{ values.appName }}/rds/master-credentials
