apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: ${{ values.appName }}
  description: Java monolith modernized onto EKS via the java-heavy-monolith playbook.
  annotations:
    backstage.io/kubernetes-namespace: ${{ values.namespace }}
  tags:
    - java
    - spring-boot
    - java-heavy-playbook
spec:
  type: service
  lifecycle: production
  owner: ${{ values.owner }}
  system: app-mod-playbooks-factory
