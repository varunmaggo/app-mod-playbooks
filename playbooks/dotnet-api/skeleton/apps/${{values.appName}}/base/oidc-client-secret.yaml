# The Keycloak Operator writes the generated client secret to
# `keycloak-client-secret-${{ values.appName }}-api` in this namespace.
# This ExternalSecret is really a same-cluster passthrough (Kubernetes
# provider) that republishes it under the name the Rollout's env expects,
# so the app manifest doesn't need to know the Operator's naming convention.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: ${{ values.appName }}-oidc-client-secret
  namespace: ${{ values.namespace }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: kubernetes-local
    kind: ClusterSecretStore
  target:
    name: ${{ values.appName }}-oidc-client-secret
    creationPolicy: Owner
  data:
    - secretKey: clientSecret
      remoteRef:
        key: keycloak-client-secret-${{ values.appName }}-api
        property: CLIENT_SECRET
