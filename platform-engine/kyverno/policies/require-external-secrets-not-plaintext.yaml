apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: require-external-secrets-not-plaintext
  annotations:
    policies.kyverno.io/title: Disallow Plaintext Secrets
    policies.kyverno.io/category: Secrets Management
    policies.kyverno.io/severity: high
spec:
  # Enforce: raw Secret manifests are never a legitimate app-team artifact
  # in this factory — External Secrets Operator (see /playbooks) is the
  # only sanctioned way to materialize a Secret, and it creates the Secret
  # itself (which is exempted below via the app-mod-factory/managed-by
  # label ESO applies), so app-authored Secrets should never pass this rule.
  validationFailureAction: Enforce
  background: true
  rules:
    - name: block-manual-secret-data
      match:
        any:
          - resources:
              kinds:
                - Secret
      exclude:
        any:
          - resources:
              selector:
                matchLabels:
                  app-mod-factory/managed-by: external-secrets-operator
      validate:
        message: >-
          Raw Secret manifests with inline data/stringData are not allowed.
          Use an External Secrets Operator ExternalSecret resource (see
          your playbook's deploy/base/external-secret.yaml) to source
          secrets from AWS Secrets Manager / SSM instead.
        deny:
          conditions:
            any:
              - key: "{{ request.object.data || `{}` | length(@) }}"
                operator: GreaterThan
                value: 0
              - key: "{{ request.object.stringData || `{}` | length(@) }}"
                operator: GreaterThan
                value: 0
