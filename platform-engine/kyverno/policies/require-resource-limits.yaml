apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: require-resource-limits
  annotations:
    policies.kyverno.io/title: Require Resource Requests and Limits
    policies.kyverno.io/category: Best Practices
    policies.kyverno.io/severity: medium
spec:
  # audit, not enforce: existing/migrated workloads from the Java-heavy
  # playbook may land without limits during the first modernization pass;
  # we want visibility before we start blocking deploys on this one.
  validationFailureAction: Audit
  background: true
  rules:
    - name: validate-resources
      match:
        any:
          - resources:
              kinds:
                - Pod
      validate:
        message: >-
          All containers must define CPU and memory requests and limits.
          Configure this in your playbook's deploy/base resources block.
        foreach:
          - list: request.object.spec.containers
            pattern:
              resources:
                requests:
                  memory: "?*"
                  cpu: "?*"
                limits:
                  memory: "?*"
                  cpu: "?*"
